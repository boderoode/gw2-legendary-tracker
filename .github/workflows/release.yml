name: Release

# Push a tag like v1.0.0 to build and publish a release. Run it by hand ("Run workflow") to rehearse the whole
# build, including the installer, without publishing anything.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check that the tag matches the version in the project
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (dotnet msbuild src/Gw2LegendaryTracker.App -getProperty:Version).Trim()
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) { throw "Tag v$tag komt niet overeen met de versie $version in het project." }

      - name: Build, test, package
        shell: pwsh
        run: ./scripts/build.ps1 -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: Gw2LegendaryTracker-release
          path: artifacts/*.*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -File |
            Where-Object { $_.Extension -in '.zip', '.exe', '.txt' } |
            ForEach-Object FullName
          gh release create '${{ github.ref_name }}' @files --title 'GW2 Legendary Tracker ${{ github.ref_name }}' --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'De release kon niet worden aangemaakt.' }
